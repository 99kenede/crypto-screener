name: Crypto CCI Screener

on:
  schedule:
    - cron: '0 * * * *' # Roda a cada 1 hora (no topo da hora, horário UTC)
  workflow_dispatch: # Permite rodar manualmente

permissions:
  contents: write # Permissão essencial para o bot fazer o git push

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Screener
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python screener.py

      - name: Commit and push results.json
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          echo "📁 Listando arquivos antes do commit:"
          ls -la
          
          if [ -f results.json ]; then
            echo "✅ results.json encontrado! Salvando alterações..."
            git add results.json
            # O '|| true' impede que o workflow falhe se não houver alterações novas
            git commit -m "Update results.json [skip ci]" || true
            git push
          else
            echo "❌ results.json NÃO encontrado! Criando arquivo vazio para não falhar..."
            echo '{"above_zero": [], "below_zero": [], "last_update": "Erro", "timeframe": "1h", "cci_period": 100, "total_above": 0, "total_below": 0}' > results.json
            git add results.json
            git commit -m "Create empty results.json [skip ci]" || true
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
